# global settings
model = "gpt-5.3-codex"

[mcp_servers.context7]
command = "bunx"
args = ["-y", "context7-mcp@2.0"]
env = { CONTEXT7_API_KEY = "secret" }
enabled = false
startup_timeout_sec = 20

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
bearer_token_env_var = "NOTION_TOKEN"
http_headers = { "Notion-Version" = "2022-06-28" }
