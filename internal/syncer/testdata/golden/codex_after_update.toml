# global settings
model = "gpt-5.3-codex"

# docs lookup server
[mcp_servers.context7]
command = "bunx"
args = ["-y", "context7-mcp@2.0"]
env = { CONTEXT7_API_KEY = "rotated" }
enabled = true
startup_timeout_sec = 20

[projects."/Users/me/repo"]
trust_level = "trusted"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
http_headers = { Notion-Version = "2022-06-28" }
