[mcp_servers.api]
url = "https://api.example.com/mcp"
bearer_token_env_var = "API_TOKEN"
http_headers = { Notion-Version = "2022-06-28" }
env_http_headers = { X-Api-Key = "API_KEY" }

[mcp_servers.runner]
command = "npx"
args = ["-y", "runner-mcp"]
env = { MODE = "fast" }
env_vars = ["GITHUB_TOKEN"]
