# Codex global configuration
model = "gpt-5"
model_provider="openai"   # 공백 없는 표기를 일부러 유지 (byte 보존 확인용)

[profiles.fast]
model = "gpt-5-mini"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT"
custom_field = "keep-me"

[projects."/Users/me/repo"]
trust_level = "trusted"
